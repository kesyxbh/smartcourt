spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:smartcourt;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.mvc.problemdetails.enabled=true

backend.jwt.secret=${JWT_SECRET:dev-only-secret-change-this-please-0123456789abcdef}
backend.jwt.expiration-minutes=120

# --- LLM provider -----------------------------------------------------------------------------
# Any OpenAI-compatible API works; DeepSeek is the default. Put the key in the LLM_API_KEY
# environment variable and never commit it. "not-configured" is a placeholder so that the
# application can still start without a key (the Spring AI starter refuses to start with an
# empty key). The AI endpoints answer 503 until a real key is set.
spring.ai.openai.api-key=${LLM_API_KEY:not-configured}
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.deepseek.com}
spring.ai.openai.chat.options.model=${LLM_MODEL:deepseek-flash}
spring.ai.openai.chat.options.temperature=0.2

# A provider outage must not hold a request thread for minutes: Spring AI retries 10 times with
# exponential backoff by default. Two attempts and short timeouts are enough here.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=3s
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s
